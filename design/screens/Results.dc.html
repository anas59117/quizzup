<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; background: #0f0e17; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    * { box-sizing: border-box; }
    .glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.35; z-index: 0; background: #ffd803; top: -120px; left: 50%; transform: translateX(-50%); }
    .container { position: relative; z-index: 1; max-width: 440px; width: 100%; text-align: center; }
    .crown { font-size: 3.5em; margin-bottom: 4px; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .win-text { color: #fffffe; font-size: 2.2em; font-weight: 800; margin: 0 0 4px 0; }
    .win-sub { color: #ffd803; font-weight: 700; font-size: 1em; margin-bottom: 28px; }
    .scoreboard { display: flex; align-items: stretch; gap: 12px; margin-bottom: 20px; }
    .final { flex: 1; background: #16161a; border: 2px solid #242629; border-radius: 18px; padding: 22px 14px; }
    .final.winner { border-color: #ffd803; background: rgba(255, 216, 3, 0.06); }
    .f-avatar { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4em; }
    .f-avatar.a1 { background: linear-gradient(135deg, #7f5af0, #2cb67d); }
    .f-avatar.a2 { background: linear-gradient(135deg, #ff6b6b, #f9bc60); }
    .f-name { color: #fffffe; font-weight: 700; font-size: 0.85em; margin-bottom: 6px; }
    .f-score { color: #ffd803; font-weight: 800; font-size: 2em; }
    .f-score.opp { color: #94a1b2; }
    .rewards { background: #16161a; border: 1px solid #242629; border-radius: 16px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-around; }
    .reward { text-align: center; }
    .reward-val { color: #2cb67d; font-weight: 800; font-size: 1.2em; }
    .reward-label { color: #94a1b2; font-size: 0.7em; font-weight: 600; margin-top: 2px; }
    .btn { width: 100%; padding: 18px; font-size: 1.1em; font-weight: 700; color: #fffffe; background: #7f5af0; border: none; border-radius: 14px; cursor: pointer; transition: all 0.3s; font-family: inherit; margin-bottom: 12px; }
    .btn:hover { background: #6b46e0; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(127, 90, 240, 0.4); }
    .btn-ghost { background: transparent; border: 2px solid #242629; color: #94a1b2; }
    .btn-ghost:hover { background: #16161a; border-color: #7f5af0; color: #fffffe; box-shadow: none; }
  </style>
</helmet>
<div class="glow"></div>
<div class="container">
  <div class="crown">👑</div>
  <h1 class="win-text">Victory!</h1>
  <p class="win-sub">You climbed to Rank #142 globally</p>

  <div class="scoreboard">
    <div class="final winner">
      <div class="f-avatar a1">🐺</div>
      <div class="f-name">You</div>
      <div class="f-score">420</div>
    </div>
    <div class="final">
      <div class="f-avatar a2">🦁</div>
      <div class="f-name">LionKing_99</div>
      <div class="f-score opp">380</div>
    </div>
  </div>

  <div class="rewards">
    <div class="reward">
      <div class="reward-val">+50 🪙</div>
      <div class="reward-label">Coins earned</div>
    </div>
    <div class="reward">
      <div class="reward-val">+120 XP</div>
      <div class="reward-label">Experience</div>
    </div>
    <div class="reward">
      <div class="reward-val">🔥 3</div>
      <div class="reward-label">Win streak</div>
    </div>
  </div>

  <button class="btn">Play Again</button>
  <button class="btn btn-ghost">Share Result</button>
</div>
</x-dc>
</body>
</html>
