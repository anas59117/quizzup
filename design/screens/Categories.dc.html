<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; background: #0f0e17; min-height: 100vh; padding: 32px 24px; }
    * { box-sizing: border-box; }
    .header { max-width: 560px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: space-between; }
    .title { color: #fffffe; font-size: 1.6em; font-weight: 800; margin: 0; }
    .profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #7f5af0, #2cb67d); display: flex; align-items: center; justify-content: center; font-size: 1.2em; }
    .coins { background: #16161a; border: 1px solid #242629; padding: 8px 14px; border-radius: 20px; color: #ffd803; font-weight: 700; font-size: 0.9em; }
    .grid { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .cat { position: relative; height: 130px; border-radius: 18px; padding: 18px; cursor: pointer; overflow: hidden; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .cat:hover { transform: translateY(-4px) scale(1.02); }
    .cat-icon { font-size: 2em; }
    .cat-name { color: #fffffe; font-weight: 700; font-size: 1.1em; }
    .cat-count { color: rgba(255, 255, 255, 0.7); font-size: 0.8em; font-weight: 600; }
    .c1 { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
    .c2 { background: linear-gradient(135deg, #7f5af0, #6246ea); }
    .c3 { background: linear-gradient(135deg, #2cb67d, #0ea472); }
    .c4 { background: linear-gradient(135deg, #f9bc60, #f79e1b); }
    .c5 { background: linear-gradient(135deg, #4361ee, #3a0ca3); }
    .c6 { background: linear-gradient(135deg, #e63946, #d00000); }
    .trending { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.3); color: #fffffe; padding: 3px 10px; border-radius: 12px; font-size: 0.65em; font-weight: 700; text-transform: uppercase; }
  </style>
</helmet>
<div class="header">
  <h1 class="title">Choose a category</h1>
  <div class="profile">
    <div class="coins">🪙 1,250</div>
    <div class="avatar">🐺</div>
  </div>
</div>
<div class="grid">
  <div class="cat c1">
    <div class="trending">🔥 Hot</div>
    <div class="cat-icon">🎬</div>
    <div>
      <div class="cat-name">Movies</div>
      <div class="cat-count">240 questions</div>
    </div>
  </div>
  <div class="cat c2">
    <div class="cat-icon">🎵</div>
    <div>
      <div class="cat-name">Music</div>
      <div class="cat-count">180 questions</div>
    </div>
  </div>
  <div class="cat c3">
    <div class="cat-icon">⚽</div>
    <div>
      <div class="cat-name">Sports</div>
      <div class="cat-count">200 questions</div>
    </div>
  </div>
  <div class="cat c4">
    <div class="cat-icon">🌍</div>
    <div>
      <div class="cat-name">Geography</div>
      <div class="cat-count">150 questions</div>
    </div>
  </div>
  <div class="cat c5">
    <div class="cat-icon">🎮</div>
    <div>
      <div class="cat-name">Gaming</div>
      <div class="cat-count">175 questions</div>
    </div>
  </div>
  <div class="cat c6">
    <div class="trending">✨ New</div>
    <div class="cat-icon">🧬</div>
    <div>
      <div class="cat-name">Science</div>
      <div class="cat-count">190 questions</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
