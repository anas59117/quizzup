<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; background: #0f0e17; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    * { box-sizing: border-box; }
    .glow { position: absolute; width: 350px; height: 350px; border-radius: 50%; filter: blur(120px); opacity: 0.35; background: #7f5af0; }
    .container { position: relative; z-index: 1; max-width: 440px; width: 100%; text-align: center; }
    .status { color: #94a1b2; font-size: 0.85em; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px; }
    .versus { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 36px; }
    .fighter { text-align: center; }
    .f-ava { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2em; margin-bottom: 12px; }
    .f-ava.me { background: linear-gradient(135deg, #7f5af0, #2cb67d); }
    .f-ava.searching { background: #16161a; border: 2px dashed #242629; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .f-label { color: #fffffe; font-weight: 700; font-size: 0.9em; }
    .f-label.dim { color: #72757e; }
    .vs-badge { color: #ffd803; font-weight: 800; font-size: 1.4em; }
    .searching-text { color: #94a1b2; font-size: 0.95em; font-weight: 600; }
    .dots span { animation: blink 1.4s infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    .bar { width: 200px; height: 4px; background: #242629; border-radius: 4px; margin: 24px auto 0; overflow: hidden; }
    .bar-fill { height: 100%; width: 40%; background: #7f5af0; border-radius: 4px; animation: load 1.5s ease-in-out infinite; }
    @keyframes load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</helmet>
<div class="glow"></div>
<div class="container">
  <div class="status">⚡ Finding opponent</div>
  <div class="versus">
    <div class="fighter">
      <div class="f-ava me">🐺</div>
      <div class="f-label">You</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="fighter">
      <div class="f-ava searching">?</div>
      <div class="f-label dim">Searching</div>
    </div>
  </div>
  <div class="searching-text">Matching you with a player<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="bar"><div class="bar-fill"></div></div>
</div>
</x-dc>
</body>
</html>
