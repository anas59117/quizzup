<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', -apple-system, sans-serif; background: #0f0e17; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    * { box-sizing: border-box; }
    .glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.4; z-index: 0; }
    .glow-1 { background: #7f5af0; top: -100px; left: -100px; }
    .glow-2 { background: #2cb67d; bottom: -100px; right: -100px; }
    .container { position: relative; z-index: 1; max-width: 440px; width: 100%; text-align: center; }
    .logo { font-size: 3.2em; font-weight: 800; color: #fffffe; margin: 0 0 4px 0; letter-spacing: -1px; }
    .logo span { color: #7f5af0; }
    .tagline { color: #94a1b2; font-size: 1em; margin-bottom: 8px; font-weight: 600; }
    .back-badge { display: inline-block; background: rgba(127, 90, 240, 0.15); color: #7f5af0; padding: 6px 16px; border-radius: 20px; font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 40px; }
    .input-wrap { margin-bottom: 16px; }
    input { width: 100%; padding: 18px 20px; font-size: 1em; background: #16161a; border: 2px solid #242629; border-radius: 14px; color: #fffffe; font-family: inherit; transition: border-color 0.3s; }
    input::placeholder { color: #72757e; }
    input:focus { outline: none; border-color: #7f5af0; }
    .btn { width: 100%; padding: 18px; font-size: 1.1em; font-weight: 700; color: #fffffe; background: #7f5af0; border: none; border-radius: 14px; cursor: pointer; transition: all 0.3s; font-family: inherit; }
    .btn:hover { background: #6b46e0; transform: translateY(-2px); box-shadow: 0 12px 30px rgba(127, 90, 240, 0.4); }
    .stats { display: flex; gap: 12px; margin-top: 32px; }
    .stat { flex: 1; background: #16161a; border: 1px solid #242629; padding: 18px 12px; border-radius: 14px; }
    .stat-num { font-size: 1.5em; font-weight: 800; color: #7f5af0; }
    .stat-label { font-size: 0.75em; color: #94a1b2; margin-top: 4px; font-weight: 600; }
  </style>
</helmet>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
  <div class="back-badge">⚡ The legend is back</div>
  <h1 class="logo">Quizz<span>Up</span></h1>
  <p class="tagline">Real-time trivia battles</p>
  <div style="height: 32px"></div>
  <div class="input-wrap">
    <input type="text" placeholder="Choose your username" value="AlphaWolf"/>
  </div>
  <button class="btn">Play Now →</button>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">2.4M</div>
      <div class="stat-label">Players</div>
    </div>
    <div class="stat">
      <div class="stat-num">180+</div>
      <div class="stat-label">Categories</div>
    </div>
    <div class="stat">
      <div class="stat-num">4.8★</div>
      <div class="stat-label">Rating</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
