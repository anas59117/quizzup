name: QuizzUp iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizzup-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_PLIST_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > Sources/QuizzUp/Resources/GoogleService-Info.plist

      - name: Set REVERSED_CLIENT_ID
        run: |
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Sources/QuizzUp/Resources/GoogleService-Info.plist)
          sed -i '' "s/REPLACE_WITH_REVERSED_CLIENT_ID/$REVERSED/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project QuizzUp.xcodeproj -scheme QuizzUp

      - name: Build (debug, no signing)
        run: |
          xcodebuild build \
            -project QuizzUp.xcodeproj \
            -scheme QuizzUp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

  archive:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_PLIST_B64 }}
        run: |
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > Sources/QuizzUp/Resources/GoogleService-Info.plist

      - name: Set REVERSED_CLIENT_ID
        run: |
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Sources/QuizzUp/Resources/GoogleService-Info.plist)
          sed -i '' "s/REPLACE_WITH_REVERSED_CLIENT_ID/$REVERSED/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install certificate and provisioning profile
        env:
          P12_B64: ${{ secrets.P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_B64: ${{ secrets.PROVISION_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_B64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project QuizzUp.xcodeproj -scheme QuizzUp

      - name: Archive
        run: |
          xcodebuild archive \
            -project QuizzUp.xcodeproj \
            -scheme QuizzUp \
            -archivePath $RUNNER_TEMP/QuizzUp.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/QuizzUp.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to App Store Connect
        env:
          APP_STORE_API_KEY_B64: ${{ secrets.APP_STORE_API_KEY_B64 }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
        run: |
          echo "$APP_STORE_API_KEY_B64" | base64 --decode > $RUNNER_TEMP/AuthKey.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/QuizzUp.ipa \
            -t ios \
            --apiKey "$APP_STORE_API_KEY_ID" \
            --apiIssuer "$APP_STORE_API_ISSUER" \
            --apiKeyPath $RUNNER_TEMP/
