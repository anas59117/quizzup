name: QuizzUp iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Archive and upload this build to App Store Connect'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quizzup-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify native timing and receiver contracts
        run: |
          swift test
          swiftc -parse-as-library \
            Sources/QuizzUp/{Models,NativeRoundTimeline,NativeAudioPolicy,NativeSocialModels,Localization,GameSocket,NativeSocialSocket}.swift \
            Tests/SocketPlayback/SocketPlayback.swift -o "$RUNNER_TEMP/native-socket-playback"
          "$RUNNER_TEMP/native-socket-playback"

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_PLIST_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_PLIST_B64" || { echo 'Missing Firebase iOS configuration secret'; exit 1; }
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > Sources/QuizzUp/Resources/GoogleService-Info.plist

      - name: Set REVERSED_CLIENT_ID
        run: |
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Sources/QuizzUp/Resources/GoogleService-Info.plist)
          sed -i '' "s/REPLACE_WITH_REVERSED_CLIENT_ID/$REVERSED/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project QuizzUp.xcodeproj -scheme QuizzUp

      - name: Build (debug, no signing)
        run: |
          xcodebuild build \
            -project QuizzUp.xcodeproj \
            -scheme QuizzUp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

  archive:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_PLIST_B64 }}
        run: |
          test -n "$GOOGLE_SERVICE_PLIST_B64" || { echo 'Missing Firebase iOS configuration secret'; exit 1; }
          echo "$GOOGLE_SERVICE_PLIST_B64" | base64 --decode > Sources/QuizzUp/Resources/GoogleService-Info.plist

      - name: Set REVERSED_CLIENT_ID
        run: |
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Sources/QuizzUp/Resources/GoogleService-Info.plist)
          sed -i '' "s/REPLACE_WITH_REVERSED_CLIENT_ID/$REVERSED/" project.yml

      - name: Install certificate and provisioning profile
        env:
          P12_B64: ${{ secrets.P12_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_B64: ${{ secrets.PROVISION_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_B64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          APPLICATION_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$APPLICATION_ID" = "$TEAM_ID.com.quizzup.app" || { echo 'Provisioning profile has the wrong bundle ID'; exit 1; }
          echo "IOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Generate Xcode project for distribution
        run: |
          # Put manual signing on the app target so package bundles do not inherit its profile.
          cat > .archive-signing.yml <<EOF
          include: project.yml
          targets:
            QuizzUp:
              settings:
                configs:
                  Release:
                    CODE_SIGN_STYLE: Manual
                    CODE_SIGN_IDENTITY: Apple Distribution
                    DEVELOPMENT_TEAM: "$IOS_TEAM_ID"
                    PROVISIONING_PROFILE_SPECIFIER: "$IOS_PROFILE_UUID"
                    CURRENT_PROJECT_VERSION: "$GITHUB_RUN_NUMBER"
          EOF
          xcodegen generate --spec .archive-signing.yml
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Sources/QuizzUp/Resources/Info.plist

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project QuizzUp.xcodeproj -scheme QuizzUp

      - name: Archive
        run: |
          xcodebuild archive \
            -project QuizzUp.xcodeproj \
            -scheme QuizzUp \
            -archivePath $RUNNER_TEMP/QuizzUp.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release

      - name: Export and upload with Xcode
        env:
          APP_STORE_API_KEY_B64: ${{ secrets.APP_STORE_API_KEY_B64 }}
          APP_STORE_API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          APP_STORE_API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER }}
        run: |
          APP_PLIST="$RUNNER_TEMP/QuizzUp.xcarchive/Products/Applications/QuizzUp.app/Info.plist"
          ARCHIVED_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          test "$ARCHIVED_BUILD" = "$GITHUB_RUN_NUMBER" || {
            echo "Archive has build $ARCHIVED_BUILD, expected $GITHUB_RUN_NUMBER"
            exit 1
          }
          test -n "$APP_STORE_API_KEY_B64" && test -n "$APP_STORE_API_KEY_ID" && test -n "$APP_STORE_API_ISSUER"
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APP_STORE_API_KEY_ID.p8"
          echo "$APP_STORE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          python3 - <<'PY'
          import os, plistlib
          options = {
              'method': 'app-store-connect', 'destination': 'upload',
              'teamID': os.environ['IOS_TEAM_ID'], 'signingStyle': 'manual',
              'provisioningProfiles': {'com.quizzup.app': os.environ['IOS_PROFILE_UUID']},
              'uploadSymbols': True, 'manageAppVersionAndBuildNumber': False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as target:
              plistlib.dump(options, target)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuizzUp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_API_ISSUER"
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
