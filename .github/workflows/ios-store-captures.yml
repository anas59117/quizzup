name: QuizzUp App Store captures

on:
  push:
    branches: ['codex/ios-store-assets-*', 'codex/ios-visual-parity-*']
    paths:
      - 'ios/Sources/**'
      - 'ios/scripts/**'
      - 'ios/project.yml'
      - '.github/workflows/ios-store-captures.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner (macos-15 uses Xcode 26.3)'
        type: choice
        options: [macos-26, macos-15, macos-15-intel]
        default: macos-26
      visual_review:
        description: 'Capture one French iPhone across the app for visual review'
        type: boolean
        default: false
      profile_review:
        description: 'Review profile and progression on standard and compact iPhones in parallel'
        type: boolean
        default: false
      onboarding_review:
        description: 'Review optional onboarding in light and dark mode on one iPhone'
        type: boolean
        default: false

permissions:
  contents: read

env:
  VISUAL_REVIEW: ${{ inputs.visual_review || inputs.profile_review || inputs.onboarding_review || startsWith(github.ref_name, 'codex/ios-visual-parity-') }}

concurrency:
  group: quizzup-store-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ inputs.profile_review && fromJSON('["standard","compact"]') || fromJSON('["all"]') }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 on alternate runner
        if: startsWith(inputs.runner, 'macos-15')
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check image validators
        run: node --test scripts/store-assets.test.cjs scripts/capture-store-screenshots.test.cjs
      - name: Test native timing and server payloads
        run: swift test
      - name: Replay native receiver and reconnect contracts
        run: |
          swiftc -parse-as-library \
            Sources/QuizzUp/{Models,NativeRoundTimeline,NativeAudioPolicy,NativeSocialModels,NativeOnboarding,Localization,GameSocket,NativeSocialSocket,NativeOnboardingSocket}.swift \
            Tests/SocketPlayback/SocketPlayback.swift -o "$RUNNER_TEMP/native-socket-playback"
          "$RUNNER_TEMP/native-socket-playback"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate simulator project
        run: xcodegen generate
      - name: Compile dedicated capture build without credentials
        run: |
          xcodebuild build \
            -project QuizzUp.xcodeproj -scheme QuizzUp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/ios-capture-build" \
            CODE_SIGNING_ALLOWED=NO \
            QUIZZUP_CAPTURE_CONDITION=STORE_CAPTURE \
            > "$RUNNER_TEMP/ios-capture-build.log" 2>&1 || {
              grep -n -A 5 -B 3 'error:' "$RUNNER_TEMP/ios-capture-build.log" || true
              tail -100 "$RUNNER_TEMP/ios-capture-build.log"
              exit 1
            }
      - name: Compile Release and verify capture arguments are absent
        if: env.VISUAL_REVIEW != 'true'
        run: |
          xcodebuild build \
            -project QuizzUp.xcodeproj -scheme QuizzUp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/ios-capture-build" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ios-release-build.log" 2>&1 || {
              grep -n -A 5 -B 3 'error:' "$RUNNER_TEMP/ios-release-build.log" || true
              tail -100 "$RUNNER_TEMP/ios-release-build.log"
              exit 1
            }
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/ios-capture-build/Build/Products/Release-iphonesimulator/QuizzUp.app/QuizzUp";if(fs.readFileSync(p).includes(Buffer.from("--store-capture-screen")))throw Error("Capture mode leaked into Release");'
      - name: Capture eight screens in French and English on native devices
        if: env.VISUAL_REVIEW != 'true'
        run: |
          node scripts/capture-store-screenshots.cjs \
            "$RUNNER_TEMP/ios-capture-build/Build/Products/Debug-iphonesimulator/QuizzUp.app" \
            "$RUNNER_TEMP/quizzup-native-screenshots"
      - name: Capture app screens for visual review
        if: env.VISUAL_REVIEW == 'true'
        run: |
          CAPTURE_ARGS=(--visual-review)
          if [[ "${{ inputs.profile_review }}" == 'true' ]]; then
            CAPTURE_ARGS+=(--profile-review --profile-${{ matrix.profile }})
          fi
          if [[ "${{ inputs.onboarding_review }}" == 'true' ]]; then
            CAPTURE_ARGS+=(--onboarding-review)
          fi
          if [[ "$GITHUB_REF_NAME" == codex/ios-visual-parity-audio-* ]]; then
            CAPTURE_ARGS+=(--duel-audio-review)
          fi
          if [[ "$GITHUB_REF_NAME" == codex/ios-visual-parity-audio-feedback-* ]]; then
            CAPTURE_ARGS+=(--audio-feedback-review)
          fi
          if [[ "$GITHUB_REF_NAME" == codex/ios-visual-parity-community-* ]]; then
            CAPTURE_ARGS+=(--community-review)
          fi
          if [[ "$GITHUB_REF_NAME" == codex/ios-visual-parity-dark-* ]]; then
            CAPTURE_ARGS+=(--appearance-review)
          fi
          if [[ "$GITHUB_REF_NAME" == codex/ios-visual-parity-dark-settings-* ]]; then
            CAPTURE_ARGS+=(--appearance-settings-review)
          fi
          node scripts/capture-store-screenshots.cjs \
            "$RUNNER_TEMP/ios-capture-build/Build/Products/Debug-iphonesimulator/QuizzUp.app" \
            "$RUNNER_TEMP/quizzup-native-screenshots" "${CAPTURE_ARGS[@]}"
      - name: Upload screenshots ready for App Store Connect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizzup-app-store-screenshots-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/quizzup-native-screenshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload compiler logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quizzup-ios-capture-diagnostics-${{ github.sha }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/ios-*-build.log
          if-no-files-found: ignore
          retention-days: 7
