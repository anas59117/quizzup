name: QuizzUp
options:
  bundleIdPrefix: com.quizzup
  deploymentTarget:
    iOS: "16.0"
targets:
  QuizzUp:
    type: application
    platform: iOS
    sources:
      - Sources/QuizzUp
    info:
      path: Sources/QuizzUp/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quizzup.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
