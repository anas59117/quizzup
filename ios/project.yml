name: QuizzUp
options:
  bundleIdPrefix: com.quizzup
  deploymentTarget:
    iOS: "16.0"
packages:
  # Only the Auth product is pulled in (not Firestore/Analytics/etc.) — this
  # app talks to its own WebSocket backend, not Firebase's database products;
  # Firebase here is purely the identity provider shared with the web app.
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  # Google Mobile Ads — interstitials before a new game after 4 completions.
  # ATT is deferred until a safe context after the first completed game.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
  # Google User Messaging Platform — Google's Consent Management Platform
  # for RGPD / EU consent. Required alongside ATT; UMP governs what the
  # Google ad network is allowed to do, ATT governs the device's IDFA.
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 2.3.0
targets:
  QuizzUp:
    type: application
    platform: iOS
    sources:
      - Sources/QuizzUp
      - path: ../frontend/src/topicPopularity.json
        buildPhase: resources
    resources:
      - path: Sources/QuizzUp/Resources/PrivacyInfo.xcprivacy
      - path: Sources/QuizzUp/Resources/topic-catalog.json
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    info:
      path: Sources/QuizzUp/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google Sign-In's OAuth redirect comes back through this custom URL
        # scheme — replace REPLACE_WITH_REVERSED_CLIENT_ID with the
        # REVERSED_CLIENT_ID value found inside GoogleService-Info.plist once
        # it's added. Google Sign-In will fail silently without this.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.825347964948-bslauj5e58lf5fqkd72kfu3mm46jvngs
        # ────────────────────────── AdMob ──────────────────────────
        # AdMob App ID. The value below is Google's reserved TEST App ID,
        # which is safe to ship and always serves a test creative.
        # Swap it for the real App ID shown in the AdMob console
        # (Settings → App settings → App ID, format: ca-app-pub-XXXX~YYYY)
        # before enabling monetisation. Set QuizzUpAdsTestMode to false and
        # fill QuizzUpInterstitialUnitID after configuring consent in AdMob.
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        QuizzUpAdsTestMode: true
        QuizzUpInterstitialUnitID: ""
        # Shown in the iOS ATT system prompt. Apple requires a plain-language
        # reason — personalised ads benefit the app's economics directly.
        NSUserTrackingUsageDescription: "Nous utilisons cet identifiant pour vous proposer des publicités plus pertinentes et soutenir le développement gratuit de QuizzUp."
        # SKAdNetwork identifiers for the ad networks AdMob mediates. The
        # list below covers the common set; keep it in sync with
        # https://developers.google.com/admob/ios/ios14 whenever a new
        # mediation partner is enabled in the AdMob console.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
