<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="color-scheme" content="dark light" />
  <script>
    try {
      const savedTheme = localStorage.getItem('quizzup-theme');
      const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch {}
  </script>
  <meta name="description" content="QuizzUp — des duels de quiz rapides, des thèmes cultes et des parties entre amis." />
  <meta property="og:title" content="QuizzUp" />
  <meta property="og:description" content="Affronte tes amis ou un adversaire en temps réel sur tes thèmes préférés." />
  <meta property="og:type" content="website" />
  <title>QuizzUp — Play. Know. Win.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" />
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
